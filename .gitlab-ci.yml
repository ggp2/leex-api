stages:
  - quality
  - test
  - security

default:
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -r requirements-dev.txt

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/

lint:
  stage: quality
  script:
    - ruff check .

unit-tests:
  stage: test
  script:
    - mkdir -p reports
    - PYTHONPATH="$CI_PROJECT_DIR" python -m pytest -v --junitxml=reports/junit.xml --cov=app --cov-report=term-missing --cov-report=xml:reports/coverage.xml
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/
    reports:
      junit: reports/junit.xml

security-code:
  stage: security
  script:
    - bandit -r app -ll

dependency-audit:
  stage: security
  script:
    - pip-audit -r requirements.txt

stages:
  - quality
  - test
  - security
  - package

default:
  image: python:3.12-slim
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -r requirements-dev.txt

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "$CI_PROJECT_DIR"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/

lint:
  stage: quality
  script:
    - ruff check .

unit-tests:
  stage: test
  script:
    - mkdir -p reports
    - >
      python -m pytest -v tests/
      --junitxml=reports/junit.xml
      --cov=app
      --cov-report=xml:reports/coverage.xml
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/
    reports:
      junit: reports/junit.xml

security-code:
  stage: security
  script:
    - mkdir -p reports
    - bandit -r app -ll -f json -o reports/bandit.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/bandit.json

dependency-audit:
  stage: security
  script:
    - mkdir -p reports
    - >
      pip-audit
      -r requirements.txt
      --format json
      --output reports/pip-audit.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/pip-audit.json

secret-scan:
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:latest
    entrypoint: [""]
  before_script: []
  script:
    - gitleaks git --redact --verbose .
  allow_failure: false

package-application:
  stage: package
  needs:
    - lint
    - unit-tests
    - security-code
    - dependency-audit
    - secret-scan
  before_script: []
  script:
    - mkdir -p dist
    - >
      tar
      --exclude=".git"
      --exclude=".venv"
      --exclude="__pycache__"
      --exclude="reports"
      --exclude="dist"
      -czf dist/leex-api-${CI_COMMIT_SHORT_SHA}.tar.gz
      app
      tests
      requirements.txt
      requirements-dev.txt
      README.md
  artifacts:
    name: "leex-api-${CI_COMMIT_SHORT_SHA}"
    expire_in: 7 days
    paths:
      - dist/*.tar.gz

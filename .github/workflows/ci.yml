name: LEEX CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: leex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: leex-api

jobs:
  quality-security:
    name: Qualité, tests et sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Préparer les rapports
        run: mkdir -p reports

      - name: Exécuter Ruff
        run: ruff check .

      - name: Exécuter les tests
        run: |
          python -m pytest -v tests/ \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml

      - name: Exécuter Bandit
        run: |
          bandit -r app -ll \
            -f json \
            -o reports/bandit.json

      - name: Auditer les dépendances
        run: |
          pip-audit \
            -r requirements.txt \
            --format json \
            --output reports/pip-audit.json

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-security-reports
          path: reports/
          retention-days: 7
          if-no-files-found: warn

  secret-scan:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Récupérer tout l’historique Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exécuter Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-application:
    name: Créer l’artefact applicatif
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - quality-security
      - secret-scan

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Créer l’archive
        run: |
          mkdir -p dist

          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".gitlab-ci.yml" \
            --exclude=".venv" \
            --exclude="__pycache__" \
            --exclude=".pytest_cache" \
            --exclude=".ruff_cache" \
            --exclude="reports" \
            --exclude="dist" \
            -czf "dist/leex-api-${GITHUB_SHA::8}.tar.gz" \
            app \
            tests \
            requirements.txt \
            requirements-dev.txt \
            README.md \
            Dockerfile \
            .dockerignore

          sha256sum \
            "dist/leex-api-${GITHUB_SHA::8}.tar.gz" \
            > "dist/leex-api-${GITHUB_SHA::8}.tar.gz.sha256"

      - name: Publier l’artefact
        uses: actions/upload-artifact@v4
        with:
          name: leex-api-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  docker-build-test:
    name: Build et test Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
      - package-application

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Construire l’image
        run: |
          docker build \
            --pull \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Inspecter l’image
        run: |
          docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}"
          docker images "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Démarrer le conteneur
        run: |
          docker run -d \
            --name leex-api-test \
            --publish 127.0.0.1:8002:8000 \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Tester la route health
        run: |
          for attempt in $(seq 1 10); do
            echo "Tentative ${attempt}/10"

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8002/health
            then
              echo
              echo "Conteneur opérationnel."
              exit 0
            fi

            sleep 3
          done

          echo "Échec du contrôle de santé."
          docker logs leex-api-test
          exit 1

      - name: Tester la route items
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8002/items

      - name: Vérifier le healthcheck Docker
        run: |
          for attempt in $(seq 1 10); do
            status="$(
              docker inspect \
                --format='{{.State.Health.Status}}' \
                leex-api-test
            )"

            echo "État Docker : ${status}"

            if [ "${status}" = "healthy" ]; then
              exit 0
            fi

            if [ "${status}" = "unhealthy" ]; then
              docker logs leex-api-test
              exit 1
            fi

            sleep 3
          done

          echo "Le healthcheck n'est pas devenu healthy."
          docker logs leex-api-test
          exit 1

      - name: Vérifier l’utilisateur non-root
        run: |
          user_id="$(docker exec leex-api-test id -u)"
          echo "UID du conteneur : ${user_id}"

          if [ "${user_id}" = "0" ]; then
            echo "Erreur : le conteneur fonctionne avec root."
            exit 1
          fi

      - name: Afficher les logs
        if: always()
        run: docker logs leex-api-test || true

      - name: Nettoyer le conteneur
        if: always()
        run: docker rm -f leex-api-test || true
